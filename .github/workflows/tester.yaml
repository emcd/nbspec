name: qa

on:
  pull_request:
    branches: ['*']
  push:
    branches: ['master', 'release-*']
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:

  initialize:
    uses: ./.github/workflows/core--initializer.yaml

  lint:
    needs: [initialize]
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    needs: [initialize, lint]
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.initialize.outputs.platforms) }}
        exclude: ${{ fromJSON(needs.initialize.outputs.matrix-exclusions) }}
    runs-on: ${{ matrix.platform }}
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Configure git for nb
        # nb prompts for git user.name/email on first use; without a
        # TTY, the prompt fails the command. Pre-set global identity
        # so nb proceeds non-interactively.
        run: |
          git config --global user.name "nbspec CI"
          git config --global user.email "nbspec-ci@users.noreply.github.com"
          git config --global init.defaultBranch master

      - name: Install nb
        run: npm install -g nb.sh@7.24.0

      - name: Put npm global bin on PATH
        # Ensure `nb` is on PATH for Unix live-nb probes and any future
        # steps. Live NbTestEnv probes are #[cfg(unix)]; Windows CI does
        # not run them (CreateProcess cannot reliably spawn npm's bash
        # entrypoint — see issues/9).
        shell: bash
        run: |
          prefix="$(npm prefix -g)"
          echo "$prefix" >> "$GITHUB_PATH"
          if [[ -d "$prefix/bin" ]]; then
            echo "$prefix/bin" >> "$GITHUB_PATH"
          fi
          echo "npm prefix -g: $prefix"

      - name: Verify nb is spawnable
        # Skip on Windows: no live-nb unit/integration coverage there.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export PATH="$(npm prefix -g):$(npm prefix -g)/bin:$PATH"
          command -v nb
          nb --version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release

  package:
    needs: [initialize, lint, test]
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Package
        run: cargo package --no-verify --list

      - name: Dry-Run Publish
        run: cargo publish --dry-run --locked

  conformance:
    needs: [initialize, test]
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.initialize.outputs.platforms) }}
        exclude: ${{ fromJSON(needs.initialize.outputs.matrix-exclusions) }}
    runs-on: ${{ matrix.platform }}
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Run Conformance Oracle
        run: bash tests/conformance/oracle.sh

  openspec-gate:
    needs: [initialize]
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Validate OpenSpec Tree
        run: npx --yes "@fission-ai/openspec@1.5.0" validate --all --strict
