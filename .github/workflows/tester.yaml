name: qa

on:
  pull_request:
    branches: ['*']
  push:
    branches: ['master', 'release-*']
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:

  initialize:
    uses: ./.github/workflows/core--initializer.yaml

  lint:
    needs: [initialize]
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    needs: [initialize, lint]
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.initialize.outputs.platforms) }}
        exclude: ${{ fromJSON(needs.initialize.outputs.matrix-exclusions) }}
    runs-on: ${{ matrix.platform }}
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Configure git for nb
        # nb prompts for git user.name/email on first use; without a
        # TTY, the prompt fails the command. Pre-set global identity
        # so nb proceeds non-interactively.
        run: |
          git config --global user.name "nbspec CI"
          git config --global user.email "nbspec-ci@users.noreply.github.com"
          git config --global init.defaultBranch master

      - name: Install nb
        run: npm install -g nb.sh@7.24.0

      - name: Put npm global bin on PATH
        # Windows runners often omit the npm global prefix from PATH for
        # subsequent steps; Unix is harmless if already present. Add both
        # `prefix` (Windows shims) and `prefix/bin` (Unix layout).
        # Rust `Command::new("nb")` on Windows only finds PATHEXT shims
        # (nb.cmd), not the extensionless bash script npm installs — so
        # synthesize nb.cmd when missing (issues/9).
        shell: bash
        run: |
          prefix="$(npm prefix -g)"
          echo "$prefix" >> "$GITHUB_PATH"
          if [[ -d "$prefix/bin" ]]; then
            echo "$prefix/bin" >> "$GITHUB_PATH"
          fi
          ensure_cmd_shim() {
            local dir="$1"
            if [[ -f "$dir/nb" && ! -f "$dir/nb.cmd" ]]; then
              printf '%s\r\n' '@echo off' 'bash "%~dp0nb" %*' > "$dir/nb.cmd"
              echo "wrote $dir/nb.cmd"
            fi
          }
          ensure_cmd_shim "$prefix"
          ensure_cmd_shim "$prefix/bin"
          echo "npm prefix -g: $prefix"
          ls -la "$prefix" | head -40 || true
          ls -la "$prefix/bin" 2>/dev/null | head -20 || true

      - name: Verify nb is spawnable
        shell: bash
        run: |
          export PATH="$(npm prefix -g):$(npm prefix -g)/bin:$PATH"
          command -v nb
          nb --version
          # Match CreateProcess / PATHEXT discovery used by Rust on Windows.
          if command -v cmd.exe >/dev/null 2>&1; then
            cmd.exe //c "where nb"
            cmd.exe //c "nb --version"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Test
        # Keep npm global bins first so child processes (NbTestEnv) see nb
        # even when the runner shell is PowerShell on Windows.
        shell: bash
        run: |
          export PATH="$(npm prefix -g):$(npm prefix -g)/bin:$PATH"
          cargo test --release

  package:
    needs: [initialize, lint, test]
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Package
        run: cargo package --no-verify --list

      - name: Dry-Run Publish
        run: cargo publish --dry-run --locked

  conformance:
    needs: [initialize, test]
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.initialize.outputs.platforms) }}
        exclude: ${{ fromJSON(needs.initialize.outputs.matrix-exclusions) }}
    runs-on: ${{ matrix.platform }}
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Run Conformance Oracle
        run: bash tests/conformance/oracle.sh

  openspec-gate:
    needs: [initialize]
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Validate OpenSpec Tree
        run: npx --yes "@fission-ai/openspec@1.5.0" validate --all --strict
