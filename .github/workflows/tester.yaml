name: qa

on:
  pull_request:
    branches: ['*']
  push:
    branches: ['master', 'release-*']
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:

  initialize:
    uses: ./.github/workflows/core--initializer.yaml

  lint:
    needs: [initialize]
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    needs: [initialize, lint]
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.initialize.outputs.platforms) }}
        exclude: ${{ fromJSON(needs.initialize.outputs.matrix-exclusions) }}
    runs-on: ${{ matrix.platform }}
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install nb
        # Cross-platform install (Git Bash .cmd launcher on Windows,
        # symlink on Unix) pinned to the version we develop against,
        # from nb-api's reusable action. Exposes nb-exec for
        # NB_API_TEST_NB so NbTestEnv resolves nb deterministically.
        # Live-nb probes stay #[cfg(unix)] for now: nb 7.24.0 itself
        # misbehaves under Git Bash on Windows (qualified-selector
        # path-in-regex; background auto-checkpoint race), independent
        # of install method. See nb-api:artifacts/2.
        id: setup-nb
        uses: emcd/nb-api/.github/actions/setup-nb@v0.3.1
        with:
          version: '7.24.0'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release
        env:
          NB_API_TEST_NB: ${{ steps.setup-nb.outputs.nb-exec }}

      - name: Test
        run: cargo test --release
        env:
          NB_API_TEST_NB: ${{ steps.setup-nb.outputs.nb-exec }}

  package:
    needs: [initialize, lint, test]
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Package
        run: cargo package --no-verify --list

      - name: Dry-Run Publish
        run: cargo publish --dry-run --locked

  conformance:
    needs: [initialize, test]
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.initialize.outputs.platforms) }}
        exclude: ${{ fromJSON(needs.initialize.outputs.matrix-exclusions) }}
    runs-on: ${{ matrix.platform }}
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Run Conformance Oracle
        run: bash tests/conformance/oracle.sh

  openspec-gate:
    needs: [initialize]
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Validate OpenSpec Tree
        run: npx --yes "@fission-ai/openspec@1.5.0" validate --all --strict
